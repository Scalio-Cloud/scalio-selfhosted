apiVersion: scalio.app/v1
app: nexus
product: Scalio Nexus
setup: 0.1.0
memory_mb: 1024
database: mongo
public: usermanagement
port: 80
secrets:
  - {name: JWT_SECRET, format: hex}
license_env: LICENSE_KEY
env:
  MONGO_URL: "{{mongo_url}}"
  DB_NAME: nexus
  JWT_SECRET: "{{secret.JWT_SECRET}}"
  PUBLIC_URL: "{{public_url}}"
  FRONTEND_URL: "{{public_url}}"
  CORS_ORIGINS: "{{public_url}}"
  PORT: "8000"
  SETUP_CODE: "{{setup_code}}"
  SCALIO_APP_LINKS: "{{app_links}}"
services:
  backend:
    image: backend
    env: common
    healthcheck: /api/health
    expose: 8000
  usermanagement:
    image: frontend
    environment:
      API_UPSTREAM: backend:8000
