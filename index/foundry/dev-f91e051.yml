apiVersion: scalio.app/v1
app: foundry
product: Scalio Foundry
setup: 0.1.0
memory_mb: 1536
database: mongo
public: frontend
port: 80
secrets:
  - {name: JWT_SECRET, format: hex}
  - {name: FOUNDRY_ENCRYPTION_KEY, format: fernet}
license_env: FOUNDRY_LICENSE_KEY
env:
  MONGO_URL: "{{mongo_url}}"
  DB_NAME: foundry
  JWT_SECRET: "{{secret.JWT_SECRET}}"
  APP_PUBLIC_URL: "{{public_url}}"
  SETUP_CODE: "{{setup_code}}"
  SCALIO_APP_LINKS: "{{app_links}}"
  FOUNDRY_ENCRYPTION_KEY: "{{secret.FOUNDRY_ENCRYPTION_KEY}}"
  PORTAL_URL: "{{public_url}}"
  COOKIE_SECURE: "true"
  DEMO_DATA: "false"
  WORKER_MODE: worker
services:
  backend:
    image: backend
    env: common
    healthcheck: /api/health
    expose: 8001
  worker:
    image: backend
    command: [python, -m, worker]
    env: common
  frontend:
    image: frontend
    environment:
      BACKEND_URL: http://backend:8001

