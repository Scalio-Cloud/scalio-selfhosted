# Example manifest (test data for tools/selfhosted_manifest.py), contract: scalio-docs interfaces/scalio-app-manifest.md
apiVersion: scalio.app/v1
app: example
product: Scalio Example
setup: 0.1.0
memory_mb: 1536
database: mongo
public: frontend
port: 80
secrets:
  - {name: JWT_SECRET, format: hex}
  - {name: BLOB_MASTER_KEY, format: b64}
  - {name: EXAMPLE_ENCRYPTION_KEY, format: fernet}
license_env: EXAMPLE_LICENSE_KEY
env:
  MONGO_URL: "{{mongo_url}}"
  DB_NAME: example
  JWT_SECRET: "{{secret.JWT_SECRET}}"
  BLOB_MASTER_KEY: "{{secret.BLOB_MASTER_KEY}}"
  EXAMPLE_ENCRYPTION_KEY: "{{secret.EXAMPLE_ENCRYPTION_KEY}}"
  APP_PUBLIC_URL: "{{public_url}}"
  FRONTEND_URL: "{{public_url}}"
  SETUP_CODE: "{{setup_code}}"
  SCALIO_APP_LINKS: "{{app_links}}"
  STORAGE_ROOT: /data/storage
  ALLOW_REGISTRATION: "false"
services:
  backend:
    image: backend
    env: common
    healthcheck: /api/health
    expose: 8001
  worker:
    image: backend
    command: [python, -m, worker]
    env: common
  frontend:
    image: frontend
    environment:
      BACKEND_URL: http://backend:8001
volumes:
  - {service: backend, path: /data/storage}
  - {service: worker, path: /data/storage}
