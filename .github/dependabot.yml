# Dependabot nach scalio-docs ADR 0131 (Richtlinie upd/U1-U8, Nachtrag 2026-11-20, concepts/update-agent.md). Gilt gleich
# für alle Repos.
# - Dependabot öffnet keine PRs von selbst (Markus 2026-11-20): `open-pull-requests-limit: 0` für die Versionsupdates,
#   die Sicherheitsupdates sind in den Einstellungen der Organisation aus. Die Dependabot-Alerts bleiben an.
# - Der Update-Agent schreibt jeden Morgen pro Repo ein Issue «Update-Vorschlag: <repo>» (scalio-infra, Label
#   update-vorschlag) mit den Sicherheitsupdates (Frist kritisch 2, hoch 7, mittel 30 Tage), montags auch Minor/Patch
#   und Majors, je mit Auswirkungen, Risiko und Empfehlung. Das Cockpit zeigt sie im Tab «Updates»; «PR erstellen
#   lassen» beauftragt den Update-Agenten mit genau diesen Updates. Mergen und ausrollen entscheidet Markus.
# - Diese Datei bleibt für die Sperren: Majors nie automatisch, Plattform-Versionen gesperrt (Python 3.13 ADR 0130, Node
#   LTS, .NET 10, PowerShell SDK 7.6, Wechsel nur per ADR), eigene Pakete (scalio-*, @scalio-cloud/*) hebt der
#   Paket-Thread (Grundregel 3). Der Update-Agent liest die Sperren und schlägt nichts Gesperrtes vor.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/"]
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 0   # keine PRs von selbst (Nachtrag 2026-11-20)
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"   # Majors nie automatisch (ADR 0131 upd/U2), Vorschlag im Cockpit
        update-types: ["version-update:semver-major"]
      - dependency-name: "scalio-*"   # eigene Pakete hebt der Paket-Thread (ADR 0131 upd/U5)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 0   # keine PRs von selbst (Nachtrag 2026-11-20)
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"   # Majors nie automatisch (ADR 0131 upd/U2), Vorschlag im Cockpit
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
